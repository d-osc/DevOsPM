[package]
name = "dev-os-package-manager"
version = "0.7.0"
edition = "2021"
rust-version = "1.88"
description = "A fast, transactional .dpk package manager for Dev OS with tar.gz compatibility"
license = "MIT"

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz"] }
ruzstd = "0.9"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true


[dev-dependencies]
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "encoder"] }
