name: Release

# Push a tag such as v0.6.0 (it must match the version in Cargo.toml) to build
# the static musl binaries, .deb/.rpm packages and example packages, then
# publish them as a GitHub Release together with SHA256SUMS.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Install Rust targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Install zig, cargo-zigbuild and nfpm
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build static binaries
        run: |
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
          cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      - name: Smoke test x86_64 binary
        run: |
          out=$(target/x86_64-unknown-linux-musl/release/dev --version)
          echo "$out"
          case "$out" in *"$VERSION"*) ;; *) echo "Binary reports wrong version" >&2; exit 1 ;; esac

      - name: Assemble release files
        run: |
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"
          DEV=target/x86_64-unknown-linux-musl/release/dev

          # pack output is architecture-independent
          "$DEV" pack ./examples/hello --output "$OUT/hello-1.0.0.dpk"
          "$DEV" pack ./examples/hello --output "$OUT/hello-1.0.0.tar.gz"
          "$DEV" pack ./examples/greeting-extension --output "$OUT/greeting-extension-1.0.0.dpk"

          # Deterministic bundles: fixed mtime/order/owner so checksums are stable.
          for PAIR in "x86_64:x86_64" "arm64:aarch64"; do
            NAME="${PAIR%%:*}"; TARGET="${PAIR##*:}"
            cp "target/$TARGET-unknown-linux-musl/release/dev" "$OUT/dev-linux-$NAME"
            STAGE=$(mktemp -d)
            cp "target/$TARGET-unknown-linux-musl/release/dev" "$STAGE/dev"
            cp scripts/install.sh "$STAGE/install.sh"
            cp LICENSE README.md "$STAGE/"
            touch -d '@0' "$STAGE"/*
            tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf - -C "$STAGE" dev install.sh LICENSE README.md | gzip -n > "$OUT/dev-linux-$NAME.tar.gz"
            rm -rf "$STAGE"
          done

          sh scripts/package_linux.sh "$OUT"
          rm -f "$OUT/SHA256SUMS.packages"

          cd "$OUT"
          sha256sum * > SHA256SUMS
          ls -la
          echo "RELEASE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RELEASE_DIR"/* \
            --title "Dev OS Package Manager $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
