name: Build and publish DevOsPM release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (must match Cargo.toml, e.g. v0.6.0)
        required: true
        default: v0.6.0
        type: string
env:
  RELEASE_VERSION: ${{ inputs.version }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64
            deb_arch: amd64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            platform: arm64
            deb_arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: Check tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$RELEASE_VERSION" != "v$version" ]; then
            echo "Tag $RELEASE_VERSION does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Prepare Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build static binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Execute Rust tests on target hardware
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Smoke test binary
        run: |
          bin=target/${{ matrix.target }}/release/dev
          file "$bin"
          out=$("$bin" --version)
          echo "$out"
          case "$out" in *"${RELEASE_VERSION#v}"*) ;; *) echo "Binary reports wrong version" >&2; exit 1 ;; esac
          python scripts/smoke_linux.py "$bin"
      - name: Package and archive
        run: |
          OUT="dist/release"
          mkdir -p "$OUT"
          BIN=target/${{ matrix.target }}/release/dev
          cp "$BIN" "$OUT/dev-linux-${{ matrix.platform }}"

          # Deterministic bundle: fixed mtime/order/owner so checksums are stable.
          STAGE=$(mktemp -d)
          cp "$BIN" "$STAGE/dev"
          cp scripts/install.sh "$STAGE/install.sh"
          cp LICENSE README.md "$STAGE/"
          touch -d '@0' "$STAGE"/*
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$STAGE" dev install.sh LICENSE README.md \
            | gzip -n > "$OUT/dev-linux-${{ matrix.platform }}.tar.gz"

          # .deb and .rpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          sh scripts/package_linux.sh "$OUT" ${{ matrix.deb_arch }}

          # Example packages are architecture-independent: build them once.
          if [ "${{ matrix.platform }}" = "x86_64" ]; then
            "$BIN" pack ./examples/hello --output "$OUT/hello-1.0.0.dpk"
            "$BIN" pack ./examples/hello --output "$OUT/hello-1.0.0.tar.gz"
            "$BIN" pack ./examples/greeting-extension --output "$OUT/greeting-extension-1.0.0.dpk"
          fi

          cd "$OUT"
          sha256sum * > SHA256SUMS
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Assemble verified assets
        shell: python
        run: |
          from pathlib import Path
          import hashlib, shutil
          destination=Path('publish');destination.mkdir()
          for manifest in Path('release-assets').rglob('SHA256SUMS'):
              for line in manifest.read_text().splitlines():
                  digest,name=line.split('  ',1)
                  source=(manifest.parent/name).resolve()
                  if not source.is_relative_to(manifest.parent.resolve()) or hashlib.sha256(source.read_bytes()).hexdigest()!=digest:
                      raise SystemExit('Invalid artifact checksum')
                  if (destination/name).exists():raise SystemExit('Duplicate release asset')
                  shutil.copy2(source,destination/name)
          assets=sorted(destination.iterdir())
          (destination/'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets))
      - name: Publish release after every architecture passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "docs/releases/$RELEASE_VERSION.md" ]; then
            notes=(--notes-file "docs/releases/$RELEASE_VERSION.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$RELEASE_VERSION" publish/* --target "$GITHUB_SHA" \
            --title "Dev OS Package Manager $RELEASE_VERSION" "${notes[@]}"
